apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taskvault
  annotations:
    # Exceptions documentées (voir docs/checkov-exceptions.md)
    checkov.io/skip1: "CKV_K8S_40=L'image postgres exige son UID 70 pour initdb (utilisateur absent de /etc/passwd sinon)"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # utilisateur "postgres" de l'image alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            # Secrets lus depuis des fichiers montés (pas de variables d'environnement visibles via `env`).
            - name: POSTGRES_USER_FILE
              value: /run/secrets/db/DB_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db/DB_PASSWORD
            - name: POSTGRES_DB_FILE
              value: /run/secrets/db/DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$(cat /run/secrets/db/DB_USER)\" -d \"$(cat /run/secrets/db/DB_NAME)\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$(cat /run/secrets/db/DB_USER)\" -d \"$(cat /run/secrets/db/DB_NAME)\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: db-secret, mountPath: /run/secrets/db, readOnly: true }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: db-init
        - name: db-secret
          secret:
            secretName: taskvault-db
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskvault
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
