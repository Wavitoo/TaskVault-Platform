# Un compte de service par application, sans token monté : ni le backend ni la base
# n'ont besoin de parler à l'API Kubernetes, donc ils n'ont aucun droit dessus.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: taskvault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: taskvault
automountServiceAccountToken: false
