apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskvault
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - postgres.yaml
  - backend.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: db-init
    files:
      - init.sql
generatorOptions:
  disableNameSuffixHash: true
