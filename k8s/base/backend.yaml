apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskvault
  annotations:
    # Exceptions documentées (voir docs/checkov-exceptions.md)
    checkov.io/skip1: "CKV_K8S_35=TaskVault lit process.env et ne doit pas être modifié ; les valeurs viennent de Vault via ESO, jamais de git"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/wavitoo/taskvault-backend@sha256:9dad6d9fcc4aa5fc869e67266c4c10cd33de71505535da017cd218642f529e6b
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: taskvault-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: taskvault-db, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: taskvault-db, key: DB_NAME } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: taskvault-app, key: JWT_SECRET } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskvault
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
