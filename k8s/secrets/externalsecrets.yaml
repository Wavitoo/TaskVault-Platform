# Ces ressources décrivent QUOI aller chercher dans Vault. Elles ne contiennent aucune valeur secrète :
# elles peuvent donc être commitées. ESO crée les Secrets Kubernetes à partir de Vault et les rafraîchit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskvault-db
  namespace: taskvault
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: taskvault-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: taskvault/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskvault-app
  namespace: taskvault
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: taskvault-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: taskvault/app
