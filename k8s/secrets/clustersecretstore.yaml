# Connexion d'External Secrets à Vault. Authentification par le ServiceAccount d'ESO (rôle "eso"),
# limitée par Vault à la lecture de secret/taskvault/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
