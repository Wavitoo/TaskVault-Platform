# Identifiants d'Argo CD pour lire le dépôt (clé de déploiement EN LECTURE SEULE), livrés par ESO depuis Vault.
# Appliqué une fois par le script de bootstrap : Argo ne peut pas se déployer lui-même avant d'avoir accès au dépôt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-taskvault-platform
  namespace: argocd
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: repo-taskvault-platform
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:Wavitoo/TaskVault-Platform.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: argocd/repo
        property: sshPrivateKey
