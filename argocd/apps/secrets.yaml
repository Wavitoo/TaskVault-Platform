# Ordre de déploiement (sync-wave) : namespace -> politiques Kyverno -> secrets -> application.
# Les politiques passent AVANT l'application : aucun pod n'est admis sans contrôle de signature.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskvault-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: taskvault
  source:
    repoURL: git@github.com:Wavitoo/TaskVault-Platform.git
    targetRevision: main
    path: k8s/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: taskvault
  syncPolicy:
    automated: { prune: true, selfHeal: true }
